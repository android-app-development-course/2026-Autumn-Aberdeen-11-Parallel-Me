function shell(html){let active=route.startsWith('host')||['booking','contact','experience','observation'].includes(route)?'journey':route;document.body.classList.toggle('reduce',state.reduced);$('#app').innerHTML=`<aside class="sidebar"><button class="logo" data-go="home" aria-label="Parallel Me 首页"><span class="logo-mark"></span><span class="brand">Parallel Me<sub>平行人生实验室</sub></span></button><nav>${NAV.map(([r,i,n])=>`<button class="nav-item ${active===r?'active':''}" data-go="${r}">${icon(i)}${n}</button>`).join('')}</nav><div class="bottom"><div class="side-note"><span class="eyebrow">A little possibility</span><p class="serif">人生，可以先试一小步。</p><button class="textbtn" data-act="vr">${icon('video')}探索 VR 未来模式</button></div><button class="account" data-go="profile"><span class="avatar-mini">${portrait()}</span><span style="flex:1"><strong>${esc(state.name)}</strong><small style="display:block">${state.membership==='free'?'免费探索者':state.membership==='plus'?'Plus 探索者':'数字订阅探索者'}</small></span>${icon('settings')}</button></div></aside><div class="workspace"><header class="topbar"><div class="logo"><span class="brand">Parallel Me<sub>另一种可能，正在发生</sub></span></div><div class="context">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})} · ${esc(state.profile.city)}</div><div class="top-actions">${gemChip()}${pill('交互原型 · 本地保存','dot')}<button class="circle-btn" data-act="brief" aria-label="今日提醒">${icon('bell')}</button><button class="avatar-mini" data-go="profile" aria-label="我的主页">${portrait()}</button></div></header><main id="main" class="content ${route==='chat'?'chat-page':''}" tabindex="-1">${html}<footer class="app-footer">PARALLEL ME · TEAM 11 &nbsp; / &nbsp; <button data-go="design" class="tiny">作业与设计说明</button> &nbsp; <button data-act="downloadhtml" class="tiny">下载单文件 HTML</button> &nbsp; <button data-act="mobilepreview" class="tiny">手机尺寸预览</button></footer></main></div><nav class="mobile-nav" aria-label="主要导航">${[['home','world','世界'],['plan','plan','计划'],['plaza','plaza','广场'],['journey','route','旅程'],['profile','person','我的']].map(([r,i,n])=>`<button class="${active===r?'active':''}" data-go="${r}">${icon(i)}${n}</button>`).join('')}</nav>`}
function head(tag,title,sub=''){return `<div class="page-head"><span class="eyebrow">${tag}</span><h1>${title}</h1><p class="muted">${sub}</p></div>`}
function journeyDots(){return `<div class="mini-journey">${[['chat','chat','聊清需求'],['plan','plan','生成计划'],['simulation','cube','线上预演'],['hosts','person','真人观察'],['experience','leaf','亲身体验']].map(([r,i,l],n)=>`<button class="journey-dot ${n===(state.observed?4:state.bookings.length?3:state.simDone?3:state.planReady?2:0)?'current':''}" data-go="${r}"><span>${icon(i)}</span>${l}</button>`).join('')}</div>`}
function welcome(){return `<div class="welcome-wrap"><div class="welcome"><div><span class="eyebrow">Welcome to your parallel world</span><h1 class="serif">如果生活，<br>还有另一种可能。</h1><p class="muted">在一个贴近现实的平行世界，先和另一种自己见面。<br>聊聊好奇，做个小实验，再把喜欢带回生活。</p><div class="welcome-actions">${btn(state.created?'回到我的平行世界':'创建我的平行身份',state.created?'go:home':'go:avatar','','arrow')}${btn('先看看世界','go:home','outline')}</div><p class="small">手机模式 · 自由探索 &nbsp; / &nbsp; <button class="textbtn" data-act="vr">VR 模式 · 未来计划</button></p></div><div class="welcome-scene">${portalArt()}<span class="pill" style="position:absolute;left:25px;bottom:28px;background:#fffdf8ce">同一个你 · 更多生活的可能</span></div></div></div>`}
function avatarPage(){return `${head('Your other self',state.created?'让另一个你，焕然一新':'先认识一下，平行世界里的你','外观可以自由表达；首次保存后，性别档案保持一致。如需更正，可在“我的 → 支持”提出。')}<div class="grid equal"><div class="column"><div class="avatar-stage" id="avatar-preview">${pill('PARALLEL ID · 0001','orange')}${portrait()}</div><div class="notice">${icon('shield')}角色外观服务于表达。线下任务仍根据真实意愿、健康限制和场地要求确认。</div></div><form class="card" id="avatar-form"><label class="label" for="username">你的昵称</label><input id="username" name="name" maxlength="16" value="${esc(state.name)}" required><label class="label">性别档案 ${state.created?'· 已锁定':''}</label><div class="chipset">${['女','男'].map(x=>`<button type="button" class="chip ${state.gender===x?'selected':''}" data-act="gender:${x}" ${state.created?'disabled':''}>${x}</button>`).join('')}</div><label class="label">肤色</label><div class="chipset">${['#f2d4b6','#e8b592','#cf966e','#ae7859','#80583e'].map(x=>`<button type="button" aria-label="肤色 ${x}" class="swatch ${state.skin===x?'selected':''}" style="background:${x}" data-act="skin:${x}"></button>`).join('')}</div><label class="label">发型</label><div class="chipset">${['轻盈短发','自然长发','利落短鲍勃'].map((x,i)=>`<button type="button" class="chip ${state.hairStyle===i?'selected':''}" data-act="hairstyle:${i}">${x}</button>`).join('')}</div><label class="label">发色</label><div class="chipset">${['#594233','#302e2b','#99745a','#b59b6a','#875545'].map(x=>`<button type="button" aria-label="发色 ${x}" class="swatch ${state.hair===x?'selected':''}" style="background:${x}" data-act="hair:${x}"></button>`).join('')}</div><label class="label">今日的穿搭</label><div class="chipset">${['#ba6948','#71816b','#d5b16d','#66858c','#8b7281'].map(x=>`<button type="button" aria-label="服饰 ${x}" class="swatch ${state.top===x?'selected':''}" style="background:${x}" data-act="top:${x}"></button>`).join('')}</div><label class="label">一个小配饰</label><div class="chipset">${['围巾','眼镜','帽子','无'].map(x=>`<button type="button" class="chip ${state.accessory===x?'selected':''}" data-act="accessory:${x}">${x}</button>`).join('')}</div><div class="gap"></div><button class="btn full" type="submit">${state.created?'保存我的新造型':'保存身份，认识我的 AI 向导'}${icon('arrow')}</button></form></div>`}
function guidesPage(){return `${head('Meet your companion','有个搭档，陪你好好探索。','两位原创平行世界向导，表达风格不同；随时可以在“我的”中切换。')}<div class="row wrap" style="max-width:780px;margin:auto;align-items:stretch">${[['nuan','暖暖','女声 · 温柔细腻','“不用立刻做决定，我们先试一小步。”'],['yao','小曜','男声 · 沉稳明朗','“把好奇变成一步行动，我陪你慢慢来。”']].map(([id,n,g,t])=>`<button class="choice-guide ${state.guide===id?'selected':''}" data-act="guide:${id}">${mascot(id)}<h2>${n}</h2><p class="small">${g}</p><p style="font-size:13px;margin:14px 0">${t}</p>${pill(state.guide===id?'已选为我的搭档':'选择这位搭档',state.guide===id?'green':'')}</button>`).join('')}</div><div class="gap"></div><div style="max-width:520px;margin:auto">${btn('开始聊聊我的另一种可能','go:chat','full','chat')}<p class="small" style="text-align:center;margin-top:16px">支持文字与语音；视频模式可开启本地摄像头预览。</p></div>`}
function home(){let done=state.tasks.filter(t=>t.status==='done').length;return `${head('Your parallel world',`${esc(state.name)}，今天想试试哪种生活？`,'这里的每一次探索，都可以成为现实里的一小步。')}<div class="grid two"><section class="column"><div class="hero"><div class="hero-copy"><span class="eyebrow">A door to another you</span><h1 class="serif">先去经历，<br>再给生活一个答案。</h1><p>让好奇有一个落点。和 ${guideName()} 聊聊，<br>为你的另一种可能，留一点时间。</p>${btn(state.chat.length?'继续和搭档聊聊':'从一次对话开始','go:chat','','chat')}</div>${portalArt()}</div><div class="card" style="padding:20px">${journeyDots()}</div><div><div class="section-head" style="margin-top:2px"><h2 class="serif">你的下一扇门</h2><span class="small">从真实世界出发</span></div><div class="grid three">${[['摄影师','光线里，找一种表达','30 min 起'],['咖啡师','一杯咖啡，一种节奏','20 min 起'],['内容创作者','把想法，变成作品','25 min 起']].map(([n,d,t],i)=>`<button class="card occupation" data-act="career:${n}"><div class="visual" style="background:${['#ebe1cf','#e9d9c4','#e2e5d2'][i]}">${careerArt(n)}</div><div class="body"><h3>${n}</h3><p class="small">${d}</p><div class="row between">${pill(t)}${icon('arrow')}</div></div></button>`).join('')}</div></div></section><aside class="column"><div class="card"><div class="card-title"><h3>今日的小事</h3>${pill(state.planActive?'进行中':'等待开始','green')}</div>${state.tasks.length?`${taskRows(state.tasks.filter(t=>t.status!=='skipped').slice(0,2),true)}<div class="gap"></div><div class="row between"><small>已经完成 ${done} / ${state.tasks.length} 项</small>${link('查看计划','plan')}</div><div class="progress"><i style="width:${done/Math.max(state.tasks.length,1)*100}%"></i></div>`:`<div class="empty" style="padding:20px 0">${icon('leaf')}<p>不用急着变成谁。</p><p class="small">先从聊聊你的好奇开始。</p></div>${btn('生成我的第一份计划','go:chat','outline full')}`}</div><div class="card"><div class="card-title"><h3>你的平行世界搭档</h3>${link('换一位','guides')}</div><div class="guide-big">${mascot()}<h3>${guideName()}</h3><small>${state.guide==='nuan'?'温柔的陪伴，也有具体的行动。':'把模糊的想法，一步步聊清楚。'}</small></div><div class="bubble-mini">今天不需要做一个重大决定，只要发现一件“我好像挺喜欢”的小事。</div></div><button class="card row between" style="background:#eee7d7;text-align:left" data-act="vr"><span><span class="eyebrow">Beyond the screen</span><h3 style="margin-top:5px">未来，在 VR 里相见</h3><small>用视觉与声音，进入平行世界</small></span>${icon('video')}</button></aside></div>`}
const questionKeys=['intent','goal','hours','budget','limits','depth'];

function ensureChat(){if(!state.chat.length){state.chat.push({role:'ai',text:`你好，我是${guideName()}。不用急着找答案，我们可以边聊边想。\n\n${questions.intent}`});save()}}
function nextKey(){return questionKeys.find(k=>!state.answers[k])}
function quickReplies(){let k=nextKey();if(state.planReady)return ['每周只能 2 小时，安排松一点','预算改成 200 元','我想先只做线上任务'];return ({intent:['我想试试摄影师的生活','我想了解咖啡师','我喜欢做内容'],goal:['我喜欢用光线表达，但担心工作节奏','想看看真实的一天是什么样','我还不太确定'],hours:['每周 4 小时，主要是周末','每周只有 2 小时','每天半小时'],budget:['最多 300 元，包含费用','先控制在 100 元以内','想先免费了解'],limits:['广州，通勤 45 分钟以内，无其他限制','广州，只想先做线上','天河，避免长时间站立'],depth:['先粗略了解','想深入体验，先观察再试做','想沉浸一周']})[k]||[]}
function chatPage(){ensureChat();return `${head('A real conversation','和另一种可能，聊一聊。','不用填写问卷。你随时可以补充、反悔，或者换一个想法。')}<div class="chat-layout"><section class="card chat-box"><div class="chat-header row between"><div class="row"><span style="width:36px">${mascot()}</span><span><strong>${guideName()}</strong><small style="display:block">${state.planReady?'计划已生成 · 可继续修改':'正在一起梳理你的需求'}</small></span></div><div class="row"><button class="circle-btn" data-act="voice" aria-label="语音对话">${icon('mic')}</button><button class="circle-btn" data-act="call:ai:video" aria-label="视频对话">${icon('video')}</button></div></div><div class="chat-messages" id="chat-messages">${state.chat.map(m=>`<div class="message ${m.role==='me'?'me':''}">${m.role==='ai'?mascot():`<span class="avatar-mini">${portrait()}</span>`}<div class="message-body"><span class="msg-name">${m.role==='ai'?guideName():esc(state.name)}</span>${esc(m.text)}</div></div>`).join('')}${state.planReady?`<div class="soft"><span class="eyebrow">A plan from our conversation</span><h3 style="margin:8px 0">${esc(state.profile.career)} · ${depthName()}</h3><p class="small">${state.profile.hours} 小时 / 周 · ${state.profile.budget} 元预算上限 · ${state.tasks.length} 个可编辑任务</p>${link('查看并编辑计划','plan')}</div>`:''}</div><div class="chat-composer"><div class="chat-quick">${quickReplies().map(q=>`<button class="chip" data-say="${esc(q)}">${q}</button>`).join('')}</div><form id="chat-form"><textarea id="chat-input" name="message" rows="1" placeholder="比如：我想试试摄影，但只有周末有空…" aria-label="发送给 AI 的消息" required></textarea><button class="btn" type="submit" aria-label="发送消息">${icon('arrow')}</button></form><p class="small" style="font-size:10px;margin-top:7px">本地情境对话演示 · 无外部 AI 服务连接 · 隐私内容保存在本机</p></div></section><aside class="chat-side column"><div class="card"><div class="card-title"><h3>正在聊清楚的事</h3>${icon('leaf')}</div>${[['想试试',state.answers.intent&&state.profile.career],['具体好奇',state.answers.goal&&state.profile.goal],['可用时间',state.answers.hours&&state.profile.hours+' 小时 / 周'],['总预算',state.answers.budget&&'¥ '+state.profile.budget],['城市 / 通勤',state.answers.limits&&state.profile.city+' / '+state.profile.commute+' 分钟'],['体验深度',state.answers.depth&&depthName()]].map(([a,b])=>`<div class="param"><span>${a}</span><strong style="max-width:65%;text-align:right">${b?esc(b):'慢慢聊，不着急'}</strong></div>`).join('')}<div class="steps">${questionKeys.map(k=>`<i class="${state.answers[k]?'filled':''}"></i>`).join('')}</div></div><div class="notice">${icon('info')}信息足够后会自动打开计划草案。你仍可以增删任务、调整深度，或回到聊天继续修改。</div><button class="textbtn" data-act="newchat">从一个新想法重新聊起</button></aside></div>`}
function numberOf(v){let s=String(v),m=s.match(/\d+(?:\.\d+)?/);if(m)return +m[0];let cn=s.match(/[零〇一二两三四五六七八九十百千半]+/);if(!cn)return null;if(cn[0]==='半')return .5;let digits={零:0,〇:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9},units={十:10,百:100,千:1000},total=0,n=0;for(let ch of cn[0]){if(ch in digits)n=digits[ch];else if(units[ch]){total+=(n||1)*units[ch];n=0}}return total+n}

function parseAnswer(text,k){const p=state.profile;let changed=[];if(/摄影|拍照|相机/.test(text)){p.career='摄影师';state.answers.intent=true;changed.push('职业')}else if(/咖啡|拉花/.test(text)){p.career='咖啡师';state.answers.intent=true;changed.push('职业')}else if(/内容|自媒体|视频创作|写作/.test(text)){p.career='内容创作者';state.answers.intent=true;changed.push('职业')}else if(k==='intent'&&text.trim().length>1){p.career=text.trim().slice(0,20);state.answers.intent=true}
let h=text.match(/(?:每周|一周|周末|每星期|只能|只有)?\s*([\d.一二两三四五六七八九十半]+)\s*(?:个)?小时/);if(h){p.hours=Math.max(.5,Math.min(40,numberOf(h[1])||4));if(text.includes('每天'))p.hours=Math.round(p.hours*7*10)/10;state.answers.hours=true;changed.push('时间')}
let money=text.match(/([\d.一二两三四五六七八九十百千]+)\s*(?:块|元)/);if(money){p.budget=Math.max(0,Math.min(50000,numberOf(money[1])||0));state.answers.budget=true;changed.push('预算')}if(/免费|不花钱|零预算/.test(text)){p.budget=0;state.answers.budget=true;changed.push('预算')}
let commute=text.match(/(\d+|[一二两三四五六七八九十]+)\s*分钟/);if(commute){p.commute=Math.max(5,Math.min(180,numberOf(commute[1])||45));state.answers.limits=true}
for(let city of ['广州','佛山','深圳','北京','上海','成都','天河','海珠','番禺'])if(text.includes(city)){p.city=['天河','海珠','番禺'].includes(city)?'广州':city;state.answers.limits=true}
if(/只.*线上|避免|限制|无障碍|没有限制|无其他/.test(text)){p.limit=text;state.answers.limits=true;changed.push('现实限制')}if(/只.*线上/.test(text)){p.onlineOnly=true;changed.push('体验方式')}
if(/粗略|入门|先看看|先了解/.test(text)){p.depth='intro';state.answers.depth=true;changed.push('深度')}else if(/深入|观察再|深度/.test(text)){p.depth='deeper';state.answers.depth=true;changed.push('深度')}else if(/沉浸/.test(text)){p.depth='immersive';state.answers.depth=true;changed.push('深度')}
if(k==='goal'&&!state.answers.goal){if(/不确定|不知道|说不清/.test(text))return {clarify:true,changed};p.goal=text.slice(0,90);state.answers.goal=true}
if(k==='hours'&&!state.answers.hours){let n=numberOf(text);if(n){p.hours=Math.max(.5,Math.min(40,n));state.answers.hours=true;changed.push('时间')}}
if(k==='budget'&&!state.answers.budget){let n=numberOf(text);if(n!==null){p.budget=n;state.answers.budget=true;changed.push('预算')}}
if(k==='limits'&&!state.answers.limits&&text.length>1){p.limit=text;state.answers.limits=true}
return {changed}}
function sendChat(text){text=String(text).trim();if(!text)return;let k=nextKey(),before=state.profile.hours;state.chat.push({role:'me',text});let result=parseAnswer(text,k);let next=nextKey();if(state.planReady){let changes=result.changed;if(changes.length){if(changes.includes('职业'))generateTasks();else if(state.profile.onlineOnly)state.tasks.forEach(t=>{if(t.type!=='online'){t.type='online';t.title='线上了解：'+t.title;t.minutes=Math.min(30,t.minutes);t.detail='以资料或公开访谈替代，无线下操作。'}});rescheduleTasks();state.chat.push({role:'ai',text:`我记下了${changes.join('、')}的调整。现在按每周 ${state.profile.hours} 小时、预算上限 ¥${state.profile.budget} 来安排，周期约 ${planDays()} 天。\n已有的手动任务已保留，日期已按时间重新分配。你可以在计划里继续逐项修改。`})}else state.chat.push({role:'ai',text:'这条补充我会留在对话里。你也可以具体说“每周改成 2 小时”“预算 200 元”或“先粗略了解”，我会调整计划参数。任务内容可以在计划页逐项编辑。'});save();render();return}
if(result.clarify){state.chat.push({role:'ai',text:`没关系。我们可以选一个小切口：你更想知道“${state.profile.career}每天怎样工作”，还是想亲手完成一个小作品？`})}else if(!next){state.chat.push({role:'ai',text:`我大致了解了：你想探索${state.profile.career}，每周 ${state.profile.hours} 小时，预算不超过 ¥${state.profile.budget}，${state.profile.city}出发。\n我会先生成一份可编辑的${depthName()}草案，接下来你可以自由增删、调整或重新安排。`});generateTasks();state.planReady=true;save();render();toast('需求已聊清楚，正在打开可编辑的计划草案…');setTimeout(()=>{if(route==='chat')nav('plan')},1100);return}else{let lead=k==='goal'?'我听到你最在意的是：'+state.profile.goal+'。\n\n':result.changed.includes('时间')?`每周 ${state.profile.hours} 小时，留在你舒服的节奏里。\n\n`:k==='intent'?`好，我们一起看看${state.profile.career}的真实一面。\n\n`:'';state.chat.push({role:'ai',text:lead+questions[next]})}save();render()}
function depthName(){return {intro:'粗略了解',deeper:'深入体验',immersive:'沉浸一周'}[state.profile.depth]||'深入体验'}
function planDays(){return Math.max(state.profile.depth==='immersive'?7:3,Math.ceil((state.profile.depth==='intro'?1.5:state.profile.depth==='immersive'?12:4)/state.profile.hours)*7)}
function templates(){let c=state.profile.career;if(c.includes('咖啡'))return [['观察一家咖啡店的工作节奏','online',20,'记录出杯、清洁与沟通三个环节'],['和咖啡师聊聊真实的一天','observation',60,'观察，不触碰高温设备；拍摄需单独同意'],['试做一杯手冲咖啡','practice',30,'在指导与安全边界内完成，写下感受'],['记下你喜欢与不喜欢的瞬间','online',15,'留下具体证据，不急着下结论']];if(c.includes('内容'))return [['拆解三个喜欢的内容作品','online',25,'记录结构、主题和制作时间'],['观察创作团队的工作流','observation',60,'不获取客户资料，未经同意不拍摄'],['写一段一分钟的内容脚本','practice',30,'从自己的生活素材开始'],['复盘表达与反馈的感受','online',15,'记下最想继续尝试的一步']];return [['看看三种不同的摄影表达','online',30,'选出一个你想学习的用光方式'],['观察一次真实的布光过程','observation',120,'先观察，不擅自操作设备，不拍摄客户'],['用五张照片表达一个想法','practice',30,'普通手机即可，避开高风险场景'],['写下第一次尝试的真实感受','online',15,'记录喜欢、犹豫与下一次想改变的事']]}
function generateTasks(){let list=templates();if(state.profile.onlineOnly)list=list.map(([title,type,minutes,detail])=>type==='online'?[title,type,minutes,detail]:['线上了解：'+title,'online',Math.min(30,minutes),'使用资料、视频或公开访谈替代，不安排线下操作']);if(state.profile.depth==='intro')list=list.filter((_,i)=>i===0||i===3);state.tasks=list.map(([title,type,minutes,detail],i)=>({id:uid(),title,type,minutes,detail,date:dateISO(Math.floor(i*planDays()/list.length)),status:'todo'}))}
function rescheduleTasks(){state.tasks.forEach((t,i)=>{if(t.status==='todo')t.date=dateISO(Math.floor(i*planDays()/Math.max(state.tasks.length,1)))})}
function taskRows(ts,compact=false){return ts.map(t=>`<div class="task-line ${t.status==='done'?'done':''}"><button class="checktask" data-act="tasktoggle:${t.id}" aria-label="${t.status==='done'?'取消完成':'完成'} ${esc(t.title)}">${t.status==='done'?icon('check'):''}</button><div class="taskbody"><h3 style="font-size:13px">${esc(t.title)}</h3><p class="small">${t.minutes} 分钟 · ${{online:'线上小实验',observation:'真人观察',practice:'亲手尝试'}[t.type]}${compact?'':' · '+formatDate(t.date)}</p>${!compact?`<p class="small" style="margin-top:6px">${esc(t.detail)}</p>`:''}${t.status==='skipped'?pill('已取消'):''}</div>${!compact?`<div class="task-actions"><button class="tiny" data-act="taskedit:${t.id}" aria-label="编辑任务">${icon('edit')}</button><button class="tiny" data-act="taskdelete:${t.id}" aria-label="删除任务">${icon('trash')}</button><button class="tiny" data-act="taskpostpone:${t.id}">顺延</button></div>`:''}</div>`).join('')}
function noPlan(){return `<div class="card empty">${mascot()}<h2 style="margin-top:15px">一份计划，从理解你开始。</h2><p class="muted" style="margin:12px 0 22px">聊聊你想体验什么、有哪些时间和现实限制。</p>${btn('和搭档聊聊','go:chat','','chat')}</div>`}
function planPage(){if(!state.planReady)return head('Your living plan','计划，跟着你的生活走。')+noPlan();let filtered=state.tasks.filter(t=>(!taskFilter||t.status===taskFilter)&&(!taskQuery||t.title.includes(taskQuery)));return `${head('Your living plan','把好奇，放进日常里。','这是一份可以改变的计划。增删任务、调整强度，或者回到对话里重新聊。')}<div class="grid two"><section><div class="plan-top"><div class="row between">${pill(state.planActive?'已启用的计划':'从对话生成 · 可编辑草案',state.planActive?'green':'orange')}<button class="textbtn" data-go="chat">回到对话 ${icon('chat')}</button></div><h2>${esc(state.profile.career)}的另一种生活</h2><p class="small">${esc(state.profile.goal)}</p><div class="row wrap" style="margin-top:15px">${pill(state.profile.hours+' 小时 / 周')}${pill('约 '+planDays()+' 天')}${pill('预算上限 ¥'+state.profile.budget)}${pill(state.profile.city+'出发')}</div></div><div class="mode-cards">${[['intro','01','粗略了解','低门槛，先看一眼'],['deeper','02','深入体验','先观察，再试着做'],['immersive','03','沉浸一周','更完整的工作节奏']].map(([k,n,h,t])=>`<button class="mode-card ${state.profile.depth===k?'active':''}" data-act="depth:${k}"><span class="tagnum">${n}</span><strong>${h}</strong><small>${t}</small></button>`).join('')}</div><div class="card"><div class="card-title"><h3>属于你的任务清单</h3>${btn('添加任务','taskadd','smallbtn outline','plus')}</div><div class="row between wrap"><div class="chipset">${[['','全部'],['todo','待完成'],['done','已完成'],['skipped','已取消']].map(([k,l])=>`<button class="chip ${taskFilter===k?'selected':''}" data-act="filter:${k}">${l}</button>`).join('')}</div><input class="search" id="task-search" placeholder="搜索任务" aria-label="搜索任务" value="${esc(taskQuery)}"></div><div id="task-results">${filtered.length?taskRows(filtered):'<div class="empty small">没有符合条件的任务，可以调整筛选或添加一个。</div>'}</div></div><div class="row wrap" style="margin-top:18px">${btn(state.planActive?'查看线上推演':'启用计划，看看会发生什么',state.planActive?'go:simulation':'activate','','arrow')}${btn('日终复盘','evening','outline','leaf')}</div></section><aside class="column"><div class="card"><h3>今天，先做这一件</h3>${taskRows(state.tasks.filter(t=>t.status==='todo').slice(0,1),true)||'<p class="muted" style="margin-top:15px">都已完成，给自己一点休息。</p>'}<div class="gap"></div>${btn('查看今日简报','brief','outline full','sun')}</div><div class="card"><div class="guide-note">${mascot()}<p style="font-size:13px">“计划是为你服务的。少做一点、换个日期，都没有关系。”<small style="display:block">— ${guideName()}</small></p></div><hr class="rule"><p class="small">真人观察与亲手实践需要先完成匹配和边界确认。没有合适场次，也可以保留线上任务。</p></div><div class="notice">${icon('shield')}医疗、法律等需要资质的场景，在此版中只提供资料了解与公开交流，不安排受限职业的线下实操。</div></aside></div>`}

function hostAvatar(h){return portrait({name:h.name,gender:h.gender,skin:'#e4b792',hair:h.hair,hairStyle:h.gender==='女'?1:0,top:h.top,accessory:'无'})}
function hostsPage(){let filter=state.hostFilter||'全部',list=HOSTS.filter(h=>(filter==='全部'||h.career===filter)&&(!state.hostOnlyAvailable||h.avail)&&(!state.hostNoMatch));return `${head('A glimpse into real life','去看看，真实的一天。','匹配共同的兴趣与合适的时间。先聊聊，再决定要不要见面。')}<div class="row between wrap" style="margin-bottom:20px"><div class="chipset">${['全部','摄影师','咖啡师','内容创作者'].map(f=>`<button class="chip ${filter===f?'selected':''}" data-act="hostfilter:${f}">${f}</button>`).join('')}</div><label class="checkline small"><input type="checkbox" id="available-hosts" ${state.hostOnlyAvailable?'checked':''}>只看有空时段</label></div><div class="notice" style="margin-bottom:20px">${icon('info')}以下人物、机构、时段与报价均为原型演示。正式匹配只应展示已授权并完成审核的供给。<button class="textbtn" style="margin-left:auto;white-space:nowrap" data-act="nomatch">${state.hostNoMatch?'恢复场次':'试试无场次'}</button></div>${list.length?`<div class="grid equal host-list">${list.map(h=>`<article class="card host-card"><div class="host-img" style="background:${h.id==='h1'?'#dfe2ce':h.id==='h2'?'#ead9c2':'#e7dfcf'}">${careerArt(h.career)}${hostAvatar(h)}<span class="pill" style="position:absolute;top:15px;left:15px">演示人物 · ${h.place}</span></div><div class="body"><div class="row between"><h3>${h.name} · ${h.career}</h3>${pill(h.avail?'有可选时段':'暂未开放',h.avail?'green':'')}</div><h2 class="serif" style="font-size:22px;margin:12px 0 7px">${h.title}</h2><p class="small">${h.quote}</p><div class="row between" style="margin-top:18px"><span class="small">体验成本 <strong style="font-size:17px;color:var(--orange)">¥${h.price}</strong> 起 · 服务费另计</span>${btn('认识一下','host:'+h.id,'smallbtn outline','arrow')}</div></div></article>`).join('')}</div>`:`<div class="card empty">${icon('calendar')}<h2>这个时间，还没有合适的人。</h2><p class="muted" style="margin:12px 0 22px">可以重新看看其他场次，或者先做一次线上小实验。</p><div class="row wrap" style="justify-content:center">${btn('重新选择场次','restorehosts','outline')}${btn('继续我的线上任务','go:plan')}</div></div>`}`}
function hostDetail(){let h=host();return `${head('Meet your host',h.title,`${h.name} · ${h.career} · ${h.place} · 演示人物与机构`)}<div class="grid two"><section class="column"><div class="card" style="padding:0;overflow:hidden"><div class="host-img" style="height:235px;background:#e6dfca">${careerArt(h.career)}${hostAvatar(h)}</div><div style="padding:24px"><span class="eyebrow">${h.shop}</span><h2 style="margin:9px 0">你好，我是${h.name}。</h2><p class="muted">${h.quote}</p><div class="chipset" style="margin-top:18px">${h.skills.map(s=>pill(s)).join('')}</div></div></div><div class="card"><h3>这次观察，我们会做什么？</h3><div class="timeline" style="margin-top:22px">${[['14:00','见面，确认今天的观察边界'],['14:15','观察真实的准备、操作与沟通过程'],['15:15','聊聊你的疑问，记录一个真实的发现'],['16:00','结束与双向反馈']].map(([n,t])=>`<div class="timeline-item"><span class="timeline-point">·</span><span class="tagnum">${n}</span><h3 style="font-size:13px">${t}</h3></div>`).join('')}</div><div class="notice">${icon('shield')}观察期间不擅自使用设备、不接触客户或隐私资料。拍摄需要独立征得双方同意，任一方都可以暂停。</div></div></section><aside class="column"><div class="card"><div class="card-title"><h3>先聊聊，慢慢确认</h3>${icon('chat')}</div><p class="small">你们会以各自的虚拟形象见面。支持演示文字、语音与视频沟通。</p><div class="gap"></div>${btn('和 '+h.name+' 聊聊','go:contact','outline full','chat')}<hr class="rule"><div class="fee-row"><span>观察时长</span><strong>2 小时</strong></div><div class="fee-row"><span>可接待人数</span><strong>最多 2 人</strong></div><div class="fee-row"><span>演示体验成本</span><strong>¥${h.price}</strong></div><p class="small">会员费、服务费及保险等按确认页逐项说明。</p><div class="gap"></div>${h.avail?btn('选择观察时间','book:observation','full','calendar'):btn('看看其他时段','go:hosts','outline full')}</div><div class="soft"><h3>还没有想好？</h3><p class="small" style="margin:8px 0">先完成你的线上任务。真实的决定，可以留到了解更多以后。</p>${link('回到计划','plan')}</div></aside></div>`}
function contactPage(){let h=host(),msgs=state.contacts[h.id]||[{role:'host',text:`你好，我是${h.name}。很高兴你对${h.career}的工作感兴趣。你最想观察哪一个环节？`}];return `${head('Meet before the meeting','先在平行世界里，认识彼此。',`${h.name} · ${h.career} · 演示对话，不会发送给真实人物`)}<div class="chat-layout"><section class="card chat-box"><div class="chat-header row between"><div class="row"><span class="avatar-mini">${hostAvatar(h)}</span><span><strong>${h.name}</strong><small style="display:block">演示接待人 · 彼此尊重边界</small></span></div><div class="row"><button class="circle-btn" data-act="call:host:voice" aria-label="语音沟通">${icon('mic')}</button><button class="circle-btn" data-act="call:host:video" aria-label="视频沟通">${icon('video')}</button></div></div><div class="chat-messages" id="contact-messages">${msgs.map(m=>`<div class="message ${m.role==='me'?'me':''}"><span class="avatar-mini">${m.role==='me'?portrait():hostAvatar(h)}</span><div class="message-body">${esc(m.text)}</div></div>`).join('')}</div><div class="chat-composer"><div class="chat-quick">${['我想了解真实的工作节奏','这个周六下午方便吗？','观察时可以拍照吗？'].map(q=>`<button class="chip" data-contact-say="${q}">${q}</button>`).join('')}</div><form id="contact-form"><textarea name="message" aria-label="发给接待人的演示消息" placeholder="聊聊你想观察的内容…" required></textarea><button class="btn" type="submit" aria-label="发送">${icon('arrow')}</button></form></div></section><aside class="chat-side column"><div class="card"><h3>准备好了，再约个时间</h3><p class="small" style="margin:12px 0 22px">确认观察目标、可用时段、拍摄限制和结束方式。</p>${btn('双方意向已确认，选择时段','book:observation','full','calendar')}</div><div class="notice">${icon('shield')}语音与视频操作为原型演示。摄像头仅在你主动允许后本地预览，不上传内容。</div></aside></div><div class="section-head"><span class="small">手机上也可以直接进入预约</span>${btn('确认意向，预约观察','book:observation','smallbtn')}</div>`}
function feeFor(amount){return Math.round(amount*(state.membership==='plus'?.05:.1)*100)/100}
function bookingPage(){let h=host(),practice=bookingKind==='practice',base=practice?h.price*1.5:h.price,service=feeFor(base);return `${head(practice?'Your first real attempt':'A carefully arranged meeting',practice?'把想尝试的，交给一次真实体验。':'约定一次，好好观察。','这是演示预约；时间、费用、知情同意和保险确认分别展示。')}<div class="grid two"><form id="booking-form" class="card"><div class="card-title"><h3>${practice?'亲身体验':'真人观察'} · ${h.shop}</h3>${pill('演示预约','orange')}</div><label class="label" for="booking-date">选择日期</label><input id="booking-date" name="date" type="date" min="${dateISO()}" value="${dateISO(3)}" required><label class="label">可用时段</label><div class="row wrap">${['10:00—12:00','14:00—16:00'].map(s=>`<button class="calendar-slot ${bookingSlot===s?'active':''}" type="button" data-act="slot:${s}">${s.replace(/周[六日] /,'')}</button>`).join('')}<button class="calendar-slot" disabled>16:00—18:00 · 已约满</button></div><label class="label" for="booking-goal">${practice?'最终体验任务与边界':'这次最想观察的部分'}</label><textarea name="goal" id="booking-goal" required>${esc(practice?(state.practiceNote||state.profile.goal):state.profile.goal)}</textarea><hr class="rule"><h3>把边界说清楚，再出发</h3><p class="small" style="margin:7px 0 14px">以下为界面与签署流程示例，不构成有法律效力的文件。</p><div class="agreement" tabindex="0"><strong>${practice?'受控体验':'真人观察'}知情同意书 · 演示摘要</strong><p>1. 本次活动用于职业探索，不构成雇佣、实习或职业资格认证。</p><p>2. ${practice?'仅在接待人与跟进人员明确许可和监督下操作设备。':'以观察和提问为主，不干扰正常工作，不擅自操作设备。'}任务范围以现场双方再次确认的清单为准。</p><p>3. 拍摄、录音和分享需要单独同意，默认不授权。任一方可随时停止。</p><p>4. 不适、冲突或风险出现时立即停止，通过跟进人员处理；未完成不惩罚。</p><p>5. 取消或改期规则应在正式付款前披露；此原型可随时取消演示预约。</p><p>6. 保险应逐项核实保障范围、时间、免责及保单信息；当前不连接保险机构，不签发保单。</p></div><label class="checkline"><input type="checkbox" name="consent" required>我已阅读演示知情同意书，并了解任务边界与取消方式。</label><label class="checkline"><input type="checkbox" name="insurance" required>我已查看保险确认步骤，知道当前没有签发真实保单。</label><label class="checkline"><input type="checkbox" name="safety" required>我会在现场再次确认边界，不适时立即停止。</label><label class="checkline"><input type="checkbox" name="filming">单独授权演示拍摄选项（非必选，默认关闭）</label><div class="row between"><label class="label" for="emergency">应急联系人 · 本地演示</label><button type="button" class="textbtn" data-act="demoemergency">填入示例</button></div><div class="grid equal" style="gap:10px"><input name="emergency" id="emergency" placeholder="联系人称呼" required><input name="phone" inputmode="tel" placeholder="演示联系电话" pattern="[0-9+ ()-]{6,20}" required aria-label="应急联系电话"></div><label class="label" for="signer">以昵称输入电子签署示例</label><input id="signer" name="signer" value="${esc(state.name)}" required><p class="small" style="margin-top:10px">未满 18 岁的真实用户需要监护人同意；正式服务应另设核验步骤。</p>${base+service>state.profile.budget?`<label class="checkline"><input type="checkbox" name="overbudget" required>本次报价超过原预算。我愿意将预算上限调整为 ¥${(base+service).toFixed(2)} 后继续本次演示。</label>`:''}<div class="gap"></div><button class="btn full" type="submit">${state.membership==='free'?'先开通会员，再确认演示预约':'确认演示签署与预约'}${icon('arrow')}</button></form><aside class="column"><div class="card"><h3>所有费用，提前可见</h3><p class="small" style="margin:8px 0 20px">依据演示报价计算，不产生扣款。</p><div class="fee-row"><span>场次体验成本 · 支付给接待方</span><strong>¥${base.toFixed(2)}</strong></div><div class="fee-row"><span>平台服务费 · ${state.membership==='plus'?'5%':'10%'}</span><strong>¥${service.toFixed(2)}</strong></div><div class="fee-row"><span>保险演示费用</span><strong>¥0.00</strong></div><p class="small">正式保险需另行报价与保障确认。</p><div class="fee-row"><span>交通 / 住宿</span><strong>不包含</strong></div><div class="fee-row total"><span>本次演示合计</span><strong>¥${(base+service).toFixed(2)}</strong></div><p class="small" style="margin-top:12px">会员费另计。学生折扣仅适用于会员费，服务费与体验成本不打折。</p></div><div class="notice ${base+service>state.profile.budget?'':'good'}">${icon(base+service>state.profile.budget?'info':'check')}${base+service>state.profile.budget?'这份报价超过你在对话里设置的预算。可以返回匹配、更换场次或继续线上任务。':'在你设置的预算上限以内。正式预约仍需双方确认报价。'}</div>${practice?`<div class="card"><div class="card-title"><h3>跟进人员 · 待确认</h3>${icon('shield')}</div><p class="small">确认后将显示跟进人员、机构对接和设施准备进度。会员类型不会降低基础安全要求。</p></div>`:''}<button class="textbtn" data-go="hosts">${icon('back')}返回匹配列表</button></aside></div>`}
function journeyPage(){let active=state.bookings.filter(b=>b.status!=='cancelled');let done=state.observed;return `${head('From possibility to reality','把平行世界，慢慢带回现实。','每次见面前确认边界，每次体验后留下证据。')}<div class="grid two"><section class="column"><div class="card"><div class="card-title"><h3>我的探索进度</h3>${pill(done?'已完成观察':'一步一步来','green')}</div><div class="timeline">${[['先聊清楚需求',state.planReady,'chat','AI 对话与可编辑的初步计划'],['在城市里预演一次',state.simDone,'simulation','看看通勤、天气和设施会带来什么影响'],['真人观察',done,'hosts','先了解真实工作，再记录你的感受'],['亲身体验',state.bookings.some(b=>b.kind==='practice'&&b.status==='done'),'experience','调整任务，与跟进人员一起完成尝试'],['每日记录与复盘',state.reviews.length>0,'journal','今天喜欢什么，明天又想怎样安排？']].map(([n,completed,r,s],i)=>`<div class="timeline-item ${completed?'done':i===(done?3:state.planReady?1:0)?'active':''}"><span class="timeline-point">${completed?'✓':i+1}</span><button data-go="${r}" style="text-align:left"><h3>${n}</h3><p class="small">${s}</p></button></div>`).join('')}</div></div><div class="card"><div class="card-title"><h3>我的约定</h3>${link('去认识接待人','hosts')}</div>${active.length?active.map(b=>bookingCard(b)).join(''):`<div class="empty"><p>还没有一场见面，不用着急。</p><p class="small" style="margin:8px 0 20px">线上任务做得舒服了，再认识真实的同行者。</p>${btn('看看可观察的真实职业','go:hosts','outline','person')}</div>`}</div></section><aside class="column"><div class="card"><div class="guide-note">${mascot()}<div><h3>体验之前，允许自己改变。</h3><p class="small">观察后产生的新想法，可以带回计划里增删与调整。</p></div></div><div class="gap"></div>${btn(done?'准备我的亲身体验':'先从真人观察开始',done?'go:experience':'go:hosts','full','arrow')}</div><div class="soft"><h3>需要有人帮忙？</h3><p class="small" style="margin:8px 0">现场不适、边界不清楚，或者只是需要暂停，都可以联系跟进人员。</p>${btn('查看支持与应急流程','support','outline full','shield')}</div>${state.bookings.some(b=>b.status==='cancelled')?`<div class="card"><h3>已取消的约定</h3>${state.bookings.filter(b=>b.status==='cancelled').map(b=>`<div class="param"><span>${b.kind==='practice'?'亲身体验':'真人观察'}</span><small>${formatDate(b.date)} · 已取消</small></div>`).join('')}</div>`:''}</aside></div>`}
function bookingCard(b){let h=HOSTS.find(h=>h.id===b.host)||HOSTS[0];return `<div class="soft" style="margin-bottom:15px"><div class="row between"><span class="eyebrow">${b.kind==='practice'?'HANDS-ON EXPERIENCE':'REAL-LIFE OBSERVATION'}</span>${pill(b.status==='done'?'已完成':'演示预约已确认',b.status==='done'?'green':'orange')}</div><h3 style="margin:12px 0 5px">${h.shop} · ${h.career}</h3><p class="small">${formatDate(b.date)} · ${b.slot.replace(/周[六日] /,'')}<br>演示签署人：${esc(b.signer)} · 拍摄${b.filming?'已选择授权示例':'未授权'}</p><div class="row wrap" style="margin-top:13px">${btn('查看安排','bookingdetail:'+b.id,'smallbtn outline')}${b.status!=='done'?btn(b.kind==='practice'?'开始体验与打卡':'观察后记录心得',b.kind==='practice'?'startpractice:'+b.id:'recordobs:'+b.id,'smallbtn'):link('回看记录','journal')}</div></div>`}
function experiencePage(){if(!state.observed)return `${head('Hands-on, when you are ready','先看过真实的一天，再试着成为。','亲身体验以前，先完成一次真人观察并记录心得。')}<div class="card empty">${icon('leaf')}<h2>还有一步，值得慢慢来。</h2><p class="muted" style="margin:12px 0 22px">你可以先去匹配观察对象，或在“我的约定”中记录已完成观察的感受。</p><div class="row wrap" style="justify-content:center">${btn('去安排真人观察','go:hosts')}${btn('查看我的约定','go:journey','outline')}</div></div>`;return `${head('Your first real attempt','这一次，亲手试试看。','先根据观察后的真实感受修改任务，再确认体验职业与跟进安排。')}<div class="grid two"><section class="column"><div class="card"><span class="eyebrow">What the observation taught you</span><h2 style="margin:10px 0">观察后的新发现</h2><p class="muted">${esc(state.observationNote||'我更了解真实的工作节奏了，想在安全范围内尝试一个小任务。')}</p><div class="gap"></div>${link('回到计划增删、编辑任务','plan')}</div><form id="experience-form" class="card"><h3>最终想体验什么？</h3><label class="label" for="experience-career">体验职业</label><select id="experience-career" name="career">${['摄影师','咖啡师','内容创作者'].map(c=>`<option ${state.profile.career===c?'selected':''}>${c}</option>`).join('')}</select><label class="label" for="experience-goal">保留、删减或增加的体验内容</label><textarea id="experience-goal" name="goal" required placeholder="比如：我想专注于布光，把客户沟通环节改为观察…">${esc(state.practiceNote||state.profile.goal)}</textarea><label class="checkline"><input type="checkbox" required>我已根据观察心得调整任务，希望继续确认真实体验的安排。</label><button class="btn full" type="submit">确认体验意图，查看签署与安排${icon('arrow')}</button></form></section><aside class="column"><div class="card"><h3>跟进人员，会准备什么？</h3><div class="gap"></div>${[['person','对接场地与接待人'],['plan','核对体验任务和设备边界'],['shield','确认保险、应急和双方同意'],['calendar','跟进到场与全程安全'],['leaf','每日提醒与日终复盘']].map(([i,t])=>`<div class="row" style="margin:16px 0;color:#6c7662">${icon(i)}<span style="font-size:13px">${t}</span></div>`).join('')}</div><div class="notice">${icon('info')}这些安排在本原型中为可操作的模拟状态。真实对接、保障与到场跟进需要运营团队确认。</div></aside></div>`}

function rewardTask(id){let t=state.tasks.find(t=>t.id===id);if(!t||t.status!=='done'||t.date!==dateISO()||state.rewardLedger.some(x=>x.taskId===id))return 0;let claimed=state.rewardLedger.filter(x=>x.date===dateISO());if(claimed.length>=3){toast('今天的 3 份任务宝石已经领取，新的收获明天再来。');return 0}state.rewardLedger.push({id:uid(),taskId:id,date:dateISO(),amount:10,title:t.title,at:new Date().toISOString()});state.gems+=10;save();render();toast('今天认真做成了一件小事，获得 10 宝石。');return 10}
function equipFashion(id){let item=FASHION.find(x=>x.id===id);if(!item||!state.ownedFashion.includes(id))return false;if(item.type==='outfit'){state.outfitId=id;state.top=item.color;state.fashionPattern=item.pattern}else{state.accessoryId=id;state.accessory=item.accessory}save();return true}

function storyWeather(c=matchingContext()){
 const w=c?.weather,d=w?.data;if(w?.status!=='ok'||!d||w.dataDate&&w.dataDate!==chosenDay())return null;

 if(!number(d.low)||!number(d.high))return null;
 return {low:Math.round(Number(d.low)),high:Math.round(Number(d.high)),rainy:number(d.code)&&Number(d.code)>=51||number(d.rain)&&Number(d.rain)>=50,probability:number(d.rain)?Math.round(Number(d.rain)):null};
}

 if(t?.status==='ok'&&d?.label&&Number.isFinite(minutes)&&minutes>=0&&d.minutes!==null){const label=String(d.label).replace(/[（(]示例[）)]/g,'');return `你翻开地图，看到「${label}」这段城市路线的驾车参考约 ${Math.round(minutes)} 分钟${Number.isFinite(km)&&km>0?'、'+km+' 公里':''}。你把路上的时间也留进计划，抵达前先整理好今天想问的问题。`}
